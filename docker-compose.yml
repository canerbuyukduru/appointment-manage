services:
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: C.nemesis123
    volumes:
      - mongodb_data:/data/db
    networks:
      - appnet

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Production overrides — .env dosyasındaki değerlerin üzerine yazar
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://admin:C.nemesis123@mongodb:27017/appointment-manage-system?authSource=admin
      - FRONTEND_URL=http://145.223.81.130:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - appnet
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://145.223.81.130:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    networks:
      - appnet
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  appnet:
    driver: bridge

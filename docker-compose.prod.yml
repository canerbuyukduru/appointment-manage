version: '3.9'

networks:
  randevu_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: randevu_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-randevu}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-randevu_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - randevu_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-randevu}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: randevu_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - randevu_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      target: production
    container_name: randevu_backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-randevu}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-randevu_db}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3001
    networks:
      - randevu_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    container_name: randevu_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - randevu_network
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: randevu_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - randevu_network
    depends_on:
      - backend
      - frontend
